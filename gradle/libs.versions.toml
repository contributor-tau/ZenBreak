[versions]
# Kotlin 2.4.20 (not 2.4.21) because KMP-NativeCoroutines 1.0.6 is built against exactly 2.4.20.
kotlin = "2.4.20"

# Android SDK levels
android-compileSdk = "37"
android-targetSdk = "36"
android-minSdk = "24"

# Shared
kotlinxCoroutines = "1.11.0"
# 1.13.0 requires Kotlin 2.4.21, see note on `kotlin` above
kotlinxSerialization = "1.12.0"
multiplatformSettings = "1.3.0"
koin = "4.2.2"
# Must match the Swift package version used in multiplatformApp.xcodeproj
nativeCoroutines = "1.0.6"
kmmBridge = "1.2.1"

# Shared Compose
composeMultiplatform = "1.12.2"
# Compose Multiplatform versions Material 3 separately; 1.9.0 is what CMP 1.12 maps `compose.material3` to
composeMaterial3 = "1.9.0"
# material-icons are no longer pulled in by material3 and were frozen at 1.7.3
composeMaterialIcons = "1.7.3"

# Desktop
# Latest 1.x plugin. 2.0 exists but is a major bump not verified against the Conveyor v12 CI pipeline.
conveyor = "1.13"
systemTray = "4.4"

# Android
agp = "9.4.0"
androidxKtx = "1.19.1"
androidxActivity = "1.13.0"
datastorePreferences = "1.3.0"

[plugins]
multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
plugin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kmm-bridge-github = { id = "co.touchlab.kmmbridge.github", version.ref = "kmmBridge" }

conveyor = { id = "dev.hydraulic.conveyor", version.ref = "conveyor" }

android-application = { id = "com.android.application", version.ref = "agp" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }

compose = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }

native-coroutines = { id = "com.rickclephas.kmp.nativecoroutines", version.ref = "nativeCoroutines" }

[libraries]
kotlinx-coroutines = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-serialization = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

multiplatform-settings = { group = "com.russhwolf", name = "multiplatform-settings", version.ref = "multiplatformSettings" }
multiplatform-settings-coroutines = { group = "com.russhwolf", name = "multiplatform-settings-coroutines", version.ref = "multiplatformSettings" }
multiplatform-settings-serialization = { group = "com.russhwolf", name = "multiplatform-settings-serialization", version.ref = "multiplatformSettings" }
multiplatform-settings-datastore = { group = "com.russhwolf", name = "multiplatform-settings-datastore", version.ref = "multiplatformSettings" }

koin-core = { group = "io.insert-koin", name = "koin-core", version.ref = "koin" }
koin-android = { group = "io.insert-koin", name = "koin-android", version.ref = "koin" }

# Compose Multiplatform (the `compose.*` accessors are deprecated since CMP 1.12)
compose-runtime = { group = "org.jetbrains.compose.runtime", name = "runtime", version.ref = "composeMultiplatform" }
compose-foundation = { group = "org.jetbrains.compose.foundation", name = "foundation", version.ref = "composeMultiplatform" }
compose-ui = { group = "org.jetbrains.compose.ui", name = "ui", version.ref = "composeMultiplatform" }
compose-ui-tooling-preview = { group = "org.jetbrains.compose.ui", name = "ui-tooling-preview", version.ref = "composeMultiplatform" }
compose-ui-tooling = { group = "org.jetbrains.compose.ui", name = "ui-tooling", version.ref = "composeMultiplatform" }
compose-material3 = { group = "org.jetbrains.compose.material3", name = "material3", version.ref = "composeMaterial3" }
compose-material-icons-core = { group = "org.jetbrains.compose.material", name = "material-icons-core", version.ref = "composeMaterialIcons" }
compose-desktop = { group = "org.jetbrains.compose.desktop", name = "desktop", version.ref = "composeMultiplatform" }

androidx-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidxKtx" }
androidx-activity = { group = "androidx.activity", name = "activity-compose", version.ref = "androidxActivity" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastorePreferences" }

system-tray = { group = "com.dorkbox", name = "SystemTray", version.ref = "systemTray" }

[bundles]
multiplatformSettings = [
    "multiplatform-settings",
    "multiplatform-settings-coroutines",
    "multiplatform-settings-serialization"
]

koin = [
    "koin-core"
]

compose-common = [
    "compose-runtime",
    "compose-foundation",
    "compose-ui",
    "compose-material3"
]
